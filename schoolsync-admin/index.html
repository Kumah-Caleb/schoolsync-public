<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Milestone SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        :root{--bg:#1a1a2e;--card-bg:#2d2d44;--text:#e0e0e0;--text2:#aaa;--border:#444;--table-stripe:#3a3a55}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(225deg,#1a1a2e,#0f0f1a);min-height:100vh;color:var(--text)}
        .container{max-width:1200px;margin:0 auto;padding:2rem}
        .card{background:var(--card-bg);border-radius:1.5rem;padding:2rem;margin-bottom:2rem;box-shadow:0 20px 40px rgba(0,0,0,0.3)}
        .header{text-align:center;margin-bottom:2rem}
        .header h1{color:#ffa502;font-size:2rem;font-weight:800;letter-spacing:-0.5px}
        .form-group{margin-bottom:1.2rem}
        .form-group label{display:block;font-weight:600;margin-bottom:.4rem;color:var(--text)}
        .form-group input,.form-group select{width:100%;padding:.8rem;border:1px solid var(--border);border-radius:.5rem;font-size:1rem;background:var(--card-bg);color:var(--text);font-family:'Inter',sans-serif}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:#ffa502}
        .btn{background:linear-gradient(225deg,#ffa502,#e69500);color:#1a1a2e;border:none;padding:.8rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600;width:100%;font-size:1rem;font-family:'Inter',sans-serif}
        .btn:hover{transform:translateY(-2px)}
        .btn-outline{background:transparent;border:2px solid #ffa502;color:#ffa502;width:auto}
        .btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b);color:white;width:auto}
        .btn-sm{padding:.4rem .8rem;font-size:.8rem;width:auto}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
        .stat-card{background:linear-gradient(225deg,#ffa502,#e69500);color:#1a1a2e;padding:1.5rem;border-radius:1rem;text-align:center}
        .stat-number{font-size:2rem;font-weight:800}
        .stat-label{margin-top:.3rem;font-size:.9rem;font-weight:600}
        .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid var(--border);flex-wrap:wrap}
        .tab{padding:.8rem 1.2rem;background:none;border:none;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:'Inter',sans-serif}
        .tab.active{color:#ffa502;border-bottom-color:#ffa502}
        table{width:100%;border-collapse:collapse;font-size:.9rem}
        th,td{padding:.8rem;text-align:left;border-bottom:1px solid var(--border)}
        th{background:var(--table-stripe);font-weight:600}
        tr:hover{background:var(--table-stripe)}
        .status-badge{display:inline-block;padding:.2rem .6rem;border-radius:1rem;font-size:.75rem;font-weight:600}
        .status-active{background:#2ecc7120;color:#27ae60}
        .status-inactive{background:#e74c3c20;color:#e74c3c}
        .status-expired{background:#f39c1220;color:#f39c12}
        .code-display{background:#1a1a2e;padding:1rem;border-radius:.5rem;font-family:'Courier New',monospace;font-size:1.2rem;text-align:center;letter-spacing:3px;color:#ffa502;border:2px dashed #ffa502;margin:1rem 0;font-weight:700}
        .error-box{background:#e74c3c20;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #e74c3c;color:#e74c3c;font-weight:500}
        .success-box{background:#2ecc7120;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #2ecc71;color:#2ecc71;font-weight:500}
        .search-container{display:flex;gap:.5rem;margin-bottom:1rem}
        .search-input{flex:1;padding:.7rem 1rem;border:1px solid var(--border);border-radius:.5rem;background:var(--card-bg);color:var(--text);font-family:'Inter',sans-serif}
        .toast{position:fixed;bottom:20px;right:20px;background:#ffa502;color:#1a1a2e;padding:.8rem 1.5rem;border-radius:2rem;z-index:1000;animation:slideIn .3s ease;font-weight:600}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        @media(max-width:768px){.container{padding:1rem}.form-row{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection">
        <div class="card" style="max-width:450px;margin:50px auto">
            <div class="header"><h1>🔐 Admin Login</h1><p style="color:var(--text2);font-weight:400">Milestone SMS - Programmer Access</p></div>
            <div id="loginError" class="error-box" style="display:none"></div>
            <div class="form-group"><label>🔑 Admin Key</label><input type="password" id="adminKey" placeholder="Enter admin key" style="font-family:'Courier New',monospace;font-size:1.1rem;text-align:center;letter-spacing:2px"></div>
            <button class="btn" onclick="adminLogin()">🔓 Access Admin Panel →</button>
            <p style="text-align:center;margin-top:1rem;color:var(--text2);font-size:.8rem;font-weight:400">Default key: admin2024</p>
        </div>
    </div>

    <div id="dashboardSection" style="display:none">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
                <h2 style="color:#ffa502;font-weight:700">⚙️ Admin Dashboard</h2>
                <button class="btn-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalSchools">0</div><div class="stat-label">Total Schools</div></div>
            <div class="stat-card"><div class="stat-number" id="activeSchools">0</div><div class="stat-label">Active Schools</div></div>
            <div class="stat-card"><div class="stat-number" id="totalStudents">0</div><div class="stat-label">Students</div></div>
            <div class="stat-card"><div class="stat-number" id="totalTeachers">0</div><div class="stat-label">Teachers</div></div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="showTab('register')">🏫 Register School</button>
                <button class="tab" onclick="showTab('schools')">📋 All Schools</button>
                <button class="tab" onclick="showTab('feedback')">💬 Feedback</button>
            </div>

            <div id="registerTab">
                <h3 style="color:#ffa502;margin-bottom:1rem;font-weight:700">Generate Activation Code</h3>
                <div class="form-row">
                    <div class="form-group"><label>🏫 School Name *</label><input type="text" id="schoolName" placeholder="Enter school name"></div>
                    <div class="form-group"><label>📍 Location</label><input type="text" id="schoolLocation" placeholder="City/Region"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>📅 License Duration (Days)</label><select id="licenseDuration"><option value="30">30 Days (1 Month)</option><option value="90">90 Days (3 Months)</option><option value="180">180 Days (6 Months)</option><option value="365" selected>365 Days (1 Year)</option><option value="730">730 Days (2 Years)</option></select></div>
                    <div class="form-group"><label>🎫 Activation Code</label><input type="text" id="customCode" placeholder="Auto-generated if empty" style="font-family:'Courier New',monospace"></div>
                </div>
                <button class="btn" onclick="registerSchool()">🎫 Generate & Register School</button>
                <div id="generatedCode" class="code-display" style="display:none"></div>
                <div id="registerError" class="error-box" style="display:none"></div>
                <div id="registerSuccess" class="success-box" style="display:none"></div>
            </div>

            <div id="schoolsTab" style="display:none">
                <h3 style="color:#ffa502;margin-bottom:1rem;font-weight:700">All Registered Schools</h3>
                <div class="search-container"><input type="text" id="schoolSearch" class="search-input" placeholder="🔍 Search schools..." onkeyup="loadSchools()"></div>
                <table><thead><tr><th>School</th><th>Code</th><th>Location</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead><tbody id="schoolsTableBody"></tbody></table>
            </div>

            <div id="feedbackTab" style="display:none">
                <h3 style="color:#ffa502;margin-bottom:1rem;font-weight:700">User Feedback</h3>
                <div id="feedbackList"></div>
            </div>
        </div>
    </div>
</div>
<div id="toast"></div>

<script>
const ADMIN_KEY='admin2024';
function showToast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('toast');setTimeout(()=>t.classList.remove('toast'),3000)}
function generateActivationCode(){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let code='';for(let i=0;i<4;i++){for(let j=0;j<4;j++){code+=chars.charAt(Math.floor(Math.random()*chars.length))}if(i<3)code+='-'}return code}

function adminLogin(){const key=document.getElementById('adminKey').value,err=document.getElementById('loginError');if(key===ADMIN_KEY){sessionStorage.setItem('admin_logged_in','true');document.getElementById('loginSection').style.display='none';document.getElementById('dashboardSection').style.display='block';loadStats();loadSchools();showToast('✅ Welcome Admin!')}else{err.innerHTML='❌ Invalid admin key';err.style.display='block'}}

async function loadStats(){
    const{count:totalSchools}=await supabase.from('schools').select('*',{count:'exact',head:true});document.getElementById('totalSchools').innerText=totalSchools||0;
    const{count:activeSchools}=await supabase.from('schools').select('*',{count:'exact',head:true}).eq('is_active',true);document.getElementById('activeSchools').innerText=activeSchools||0;
    const{count:totalStudents}=await supabase.from('students').select('*',{count:'exact',head:true});document.getElementById('totalStudents').innerText=totalStudents||0;
    const{count:totalTeachers}=await supabase.from('teachers').select('*',{count:'exact',head:true});document.getElementById('totalTeachers').innerText=totalTeachers||0;
}

async function registerSchool(){
    const name=document.getElementById('schoolName').value.trim(),location=document.getElementById('schoolLocation').value.trim(),duration=parseInt(document.getElementById('licenseDuration').value);
    let code=document.getElementById('customCode').value.trim().toUpperCase();
    const errDiv=document.getElementById('registerError'),succDiv=document.getElementById('registerSuccess'),codeDiv=document.getElementById('generatedCode');
    errDiv.style.display='none';succDiv.style.display='none';codeDiv.style.display='none';
    if(!name){errDiv.innerHTML='❌ School name is required';errDiv.style.display='block';return}
    if(!code)code=generateActivationCode();
    const{data:existing}=await supabase.from('schools').select('id').eq('activation_code',code);
    if(existing&&existing.length>0){errDiv.innerHTML='❌ Activation code already exists. Generate a new one.';errDiv.style.display='block';return}
    const{error}=await supabase.from('schools').insert([{name,activation_code:code,license_duration:duration,is_active:false}]);
    if(error){errDiv.innerHTML='❌ Failed to register school: '+error.message;errDiv.style.display='block';return}
    codeDiv.innerHTML=`🎫 Activation Code: <strong>${code}</strong>`;codeDiv.style.display='block';
    succDiv.innerHTML=`✅ School "${name}" registered successfully!<br>Give this code to the headmaster: <strong>${code}</strong><br>License: ${duration} days`;succDiv.style.display='block';
    document.getElementById('schoolName').value='';document.getElementById('schoolLocation').value='';document.getElementById('customCode').value='';
    await loadStats();await loadSchools();
}

async function loadSchools(){
    const search=document.getElementById('schoolSearch')?.value.trim().toLowerCase()||'';
    let query=supabase.from('schools').select('*').order('created_at',{ascending:false});
    if(search)query=query.ilike('name',`%${search}%`);
    const{data:schools}=await query;const tbody=document.getElementById('schoolsTableBody');
    if(!schools||schools.length===0){tbody.innerHTML='<tr><td colspan="6" style="text-align:center">No schools registered</td></tr>';return}
    tbody.innerHTML=schools.map(s=>{let statusClass='status-inactive',statusText='Inactive';if(s.is_active){const now=new Date(),expiry=new Date(s.license_expiry);if(expiry<now){statusClass='status-expired';statusText='Expired'}else{statusClass='status-active';statusText='Active'}}return`<tr><td><strong>${s.name}</strong></td><td><code style="color:#ffa502;font-weight:600">${s.activation_code}</code></td><td>${s.location||'—'}</td><td>${s.license_expiry?new Date(s.license_expiry).toLocaleDateString():'Not activated'}</td><td><span class="status-badge ${statusClass}">${statusText}</span></td><td><button class="btn-sm btn-outline" onclick="viewSchool('${s.id}')"><i class="fas fa-eye"></i></button> <button class="btn-sm" style="background:#e74c3c;color:white" onclick="deleteSchool(${s.id},'${s.name}')"><i class="fas fa-trash"></i></button> ${!s.is_active?`<button class="btn-sm" style="background:#2ecc71;color:white" onclick="regenerateCode(${s.id},'${s.name}')"><i class="fas fa-key"></i></button>`:''}</td></tr>`}).join('')}

async function viewSchool(id){
    const{data:school}=await supabase.from('schools').select('*').eq('id',id).single();if(!school)return;
    const{count:students}=await supabase.from('students').select('*',{count:'exact',head:true}).eq('school_id',id);
    const{count:teachers}=await supabase.from('teachers').select('*',{count:'exact',head:true}).eq('school_id',id);
    const{count:programmes}=await supabase.from('programmes').select('*',{count:'exact',head:true}).eq('school_id',id);
    alert(`🏫 ${school.name}\n📍 ${school.location||'N/A'}\n🎫 Code: ${school.activation_code}\n📅 Created: ${new Date(school.created_at).toLocaleDateString()}\n${school.is_active?`✅ Active\n📅 Expires: ${new Date(school.license_expiry).toLocaleDateString()}\n👨‍🏫 Teachers: ${teachers||0}\n👨‍🎓 Students: ${students||0}\n📚 Programmes: ${programmes||0}`:'⏳ Not yet activated'}`)
}

async function deleteSchool(id,name){if(!confirm(`Delete "${name}"? This will remove ALL data for this school!`))return;if(!confirm('Are you SURE? This cannot be undone!'))return;await supabase.from('scores').delete().eq('school_id',id);await supabase.from('enrollments').delete().eq('student_id',id);await supabase.from('students').delete().eq('school_id',id);await supabase.from('subjects').delete().eq('school_id',id);await supabase.from('programmes').delete().eq('school_id',id);await supabase.from('teachers').delete().eq('school_id',id);await supabase.from('headmasters').delete().eq('school_id',id);await supabase.from('schools').delete().eq('id',id);showToast('🗑 School deleted');await loadStats();await loadSchools()}

async function regenerateCode(id,name){if(!confirm(`Generate new activation code for "${name}"?`))return;const newCode=generateActivationCode();await supabase.from('schools').update({activation_code:newCode}).eq('id',id);alert(`✅ New activation code for ${name}:\n\n${newCode}`);await loadSchools()}

async function loadFeedback(){
    const container=document.getElementById('feedbackList'),{data:feedback}=await supabase.from('feedback').select('*').order('created_at',{ascending:false});
    if(!feedback||feedback.length===0){container.innerHTML='<p style="color:var(--text2);font-weight:400">No feedback received</p>';return}
    container.innerHTML=feedback.map(f=>`<div class="card" style="margin-bottom:1rem;padding:1.5rem"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem"><strong style="font-weight:600">${f.name}</strong><small style="color:var(--text2)">${new Date(f.created_at).toLocaleString()}</small></div>${f.email?`<p style="color:#ffa502;font-size:.9rem;font-weight:500">📧 ${f.email}</p>`:''}${f.subject?`<p style="color:var(--text2);font-size:.9rem;font-weight:500">📌 ${f.subject}</p>`:''}<p style="margin-top:.5rem;line-height:1.6;font-weight:400">${f.message}</p></div>`).join('')
}

function showTab(tab){['register','schools','feedback'].forEach(t=>document.getElementById(t+'Tab').style.display='none');document.getElementById(tab+'Tab').style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');if(tab==='feedback')loadFeedback();if(tab==='schools')loadSchools()}
function logout(){sessionStorage.removeItem('admin_logged_in');document.getElementById('dashboardSection').style.display='none';document.getElementById('loginSection').style.display='block';document.getElementById('adminKey').value='';showToast('👋 Logged out')}

async function checkSession(){if(sessionStorage.getItem('admin_logged_in')==='true'){document.getElementById('loginSection').style.display='none';document.getElementById('dashboardSection').style.display='block';await loadStats();await loadSchools()}}
checkSession();
</script>
</body>
</html>
