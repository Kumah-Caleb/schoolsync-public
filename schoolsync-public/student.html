<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Milestone SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        :root{--bg:#2d6b3f;--bg2:#d4a530;--card-bg:white;--text:#333;--text2:#666;--border:#ddd;--table-stripe:#f8f9fa}
        .dark-mode{--bg:#1a1a2e;--bg2:#0f0f1a;--card-bg:#2d2d44;--text:#e0e0e0;--text2:#aaa;--border:#444;--table-stripe:#3a3a55}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(225deg,#8db355,#e0c87a);min-height:100vh;color:var(--text)}
        .container{max-width:1200px;margin:0 auto;padding:2rem}
        .card{background:var(--card-bg);border-radius:1.5rem;padding:2rem;margin-bottom:2rem;box-shadow:0 20px 40px rgba(0,0,0,0.1)}
        .login-container{max-width:500px;margin:50px auto;background:var(--card-bg);border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.1)}
        .header{background:linear-gradient(225deg,#8db355,#e0c87a);color:white;padding:1.5rem 2rem;border-radius:1rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
        .header h2{color:white;border:none;padding:0;margin:0}
        h2{color:#1a472a;margin-bottom:15px;border-left:4px solid #c8960a;padding-left:12px}
        .dark-mode h2{color:#c8960a}
        .form-group{margin-bottom:1.2rem}
        .form-group label{display:block;font-weight:600;margin-bottom:.4rem;color:var(--text)}
        .form-group input{width:100%;padding:.8rem;border:1px solid var(--border);border-radius:.5rem;font-size:1rem;background:var(--card-bg);color:var(--text)}
        .form-group input:focus{outline:none;border-color:#c8960a}
        .btn{background:linear-gradient(225deg,#8db355,#e0c87a);color:white;border:none;padding:.8rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600;width:100%;font-size:1rem}
        .btn:hover{transform:translateY(-2px)}
        .btn-sm{padding:.4rem .8rem;font-size:.8rem;width:auto}
        .btn-success{background:linear-gradient(135deg,#2ecc71,#27ae60);width:auto}
        .btn-info{background:linear-gradient(225deg,#8db355,#e0c87a);width:auto}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
        .stat-card{background:linear-gradient(225deg,#8db355,#e0c87a);color:white;padding:1.5rem;border-radius:1rem;text-align:center}
        .stat-number{font-size:2rem;font-weight:bold}
        .stat-label{margin-top:.3rem;font-size:.9rem;opacity:.9}
        .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid var(--border);flex-wrap:wrap}
        .tab{padding:.8rem 1.2rem;background:none;border:none;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px}
        .tab.active{color:#c8960a;border-bottom-color:#c8960a}
        table{width:100%;border-collapse:collapse;font-size:.9rem}
        th,td{padding:.8rem;text-align:left;border-bottom:1px solid var(--border)}
        th{background:var(--table-stripe);font-weight:600}
        tr:hover{background:var(--table-stripe)}
        .grade-a1{background:#2e7d32;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-b2{background:#43a047;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-b3{background:#66bb6a;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-c4{background:#ef6c00;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-c5{background:#ff9800;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-c6{background:#ffb74d;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-d7,.grade-e8,.grade-f9{background:#c62828;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .error-box{background:#ffebee;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #e74c3c;color:#c62828}
        .success-box{background:#e8f5e9;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #2ecc71;color:#2e7d32}
        .warning-box{background:#fff3e0;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #f39c12}
        .approval-banner{background:#fff3cd;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border:2px solid #c8960a;text-align:center}
        .approval-banner.approved{background:#e8f5e9;border-color:#2ecc71}
        .enrollment-card{border:2px solid #c8960a;padding:1rem;border-radius:.5rem;margin-bottom:1rem;transition:all .3s}
        .enrollment-card:hover{box-shadow:0 5px 15px rgba(255,165,2,0.2)}
        .enrollment-card.selected{border-color:#2ecc71;background:#f0fff0}
        .progress-bar{width:100%;height:10px;background:#eee;border-radius:5px;margin-top:.5rem;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(225deg,#8db355,#e0c87a);border-radius:5px}
        .registration-id-display{background:#fff3cd;padding:1.5rem;border-radius:.5rem;text-align:center;border:2px solid #c8960a}
        .student-id{font-size:2rem;font-weight:bold;color:#c8960a;letter-spacing:3px;font-family:'Courier New',monospace}
        .level-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:bold}
        .level-shs{background:#e8f0fe;color:#1a472a}.level-jhs{background:#fff3e0;color:#e67e22}
        .toast{position:fixed;bottom:20px;right:20px;background:#333;color:white;padding:.8rem 1.5rem;border-radius:2rem;z-index:1000;animation:slideIn .3s ease}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        @media(max-width:768px){.container{padding:1rem}.header h2{font-size:1.2rem}}
    </style>
</head>
<body>

<!-- LOGIN SECTION -->
<div id="loginSection">
    <div class="login-container">
        <h1 style="text-align:center;color:#1a472a">🎓 Student Portal</h1>
        <p style="text-align:center;color:var(--text2)">Milestone School Management System</p>
        <div id="loginMessage"></div>
        <div class="form-group"><label>🏫 School</label><input type="text" id="studentSchool" placeholder="School name"></div>
        <div class="form-group"><label>🆔 Student ID</label><input type="text" id="studentIdLogin" placeholder="e.g., STU001" style="font-family:'Courier New',monospace;font-size:1.1rem;letter-spacing:2px"></div>
        <div class="form-group"><label>🔒 Password</label><input type="password" id="studentPassword" placeholder="Password"></div>
        <button class="btn" onclick="loginStudent()">Login →</button>
        <div style="text-align:center;margin-top:1.5rem"><a href="#" onclick="showRegistration()" style="color:#c8960a">New student? Register →</a></div>
    </div>
</div>

<!-- REGISTRATION SECTION -->
<div id="registrationSection" style="display:none">
    <div class="login-container">
        <h1 style="text-align:center;color:#1a472a">📝 Register</h1>
        <div id="registrationMessage"></div>
        <div class="form-group"><label>🏫 School *</label><input type="text" id="regSchoolName"></div>
        <div class="form-group"><label>👤 Full Name *</label><input type="text" id="regFullName"></div>
        <div class="form-group"><label>📧 Email</label><input type="email" id="regEmail"></div>
        <div class="form-group"><label>📞 Phone</label><input type="tel" id="regPhone"></div>
        <div class="form-group"><label>🔒 Password *</label><input type="password" id="regPassword" placeholder="Min 6 chars"></div>
        <div class="form-group"><label>🔒 Confirm *</label><input type="password" id="regConfirmPassword"></div>
        <button class="btn btn-success" onclick="registerStudent()">📝 Register →</button>
        <div style="text-align:center;margin-top:1rem"><a href="#" onclick="showLogin()" style="color:#c8960a">← Back</a></div>
    </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashboardSection" style="display:none">
    <div class="header">
        <div>
            <h2><span id="schoolName"></span></h2>
            <small style="color:#ffcccc">🆔 <span id="studentIdDisplay"></span></small>
        </div>
        <div>
            <span style="color:white">👤 <span id="studentDisplayName"></span></span>
            <button class="btn-sm" onclick="toggleDarkMode()" style="background:#555"><i class="fas fa-moon"></i></button>
            <button class="btn-sm" onclick="logout()" style="background:#2c3e50"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="container">
        <div id="approvalBanner"></div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalSubjectsEnrolled">0</div><div class="stat-label">My Subjects</div></div>
            <div class="stat-card"><div class="stat-number" id="overallAverage">0%</div><div class="stat-label">Average</div></div>
            <div class="stat-card"><div class="stat-number" id="currentGrade">N/A</div><div class="stat-label">Grade</div></div>
            <div class="stat-card"><div class="stat-number" id="totalAssessments">0</div><div class="stat-label">Assessments</div></div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="showTab('enrollment')">📚 Enrollment</button>
                <button class="tab" onclick="showTab('subjects')">📖 My Subjects</button>
                <button class="tab" onclick="showTab('grades')">🎓 Grades</button>
                <button class="tab" onclick="showTab('profile')">👤 Profile</button>
            </div>

            <!-- Enrollment Tab -->
            <div id="enrollmentTab">
                <h2>Available Programmes</h2>
                <div id="availableProgrammes"></div>
                <div id="subjectSelection" style="display:none;margin-top:1.5rem">
                    <h2>Select Subjects</h2>
                    <div id="subjectCheckboxes"></div>
                </div>
            </div>

            <!-- My Subjects Tab -->
            <div id="subjectsTab" style="display:none">
                <h2>My Enrolled Subjects</h2>
                <div id="mySubjectsList"></div>
            </div>

            <!-- Grades Tab -->
            <div id="gradesTab" style="display:none">
                <h2>My Grades</h2>
                <div id="myGrades"></div>
            </div>

            <!-- Profile Tab -->
            <div id="profileTab" style="display:none">
                <h2>My Profile</h2>
                <div class="form-group"><label>Student ID</label><input type="text" id="profileStudentId" readonly></div>
                <div class="form-group"><label>Full Name</label><input type="text" id="profileFullName"></div>
                <div class="form-group"><label>School</label><input type="text" id="profileSchool" readonly></div>
                <div class="form-group"><label>Programme</label><input type="text" id="profileProgramme" readonly></div>
                <div class="form-group"><label>Status</label><input type="text" id="profileStatus" readonly></div>
                <div class="form-group"><label>Email</label><input type="email" id="profileEmail"></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="profilePhone"></div>
                <button class="btn" onclick="updateProfile()" style="width:auto">💾 Update Profile</button>
                
                <h3 style="margin-top:2rem">🔐 Change Password</h3>
                <div class="form-group"><label>Current Password</label><input type="password" id="currentPwd"></div>
                <div class="form-group"><label>New Password</label><input type="password" id="newPassword"></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword"></div>
                <button class="btn btn-info" onclick="changePassword()" style="width:auto">🔒 Update Password</button>
            </div>
        </div>
    </div>
</div>
<div id="toast"></div>

<script>
let currentStudent = null;
let currentSchool = null;
let schoolData = { programmes: [], subjects: [], students: [], scores: [], enrollments: [] };

function hashPassword(pw) {
    const s = 'SchoolSync_GH_2024';
    return btoa(btoa(pw + s).split('').reverse().join('') + s);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerHTML = msg;
    t.classList.add('toast');
    setTimeout(() => t.classList.remove('toast'), 3000);
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
}

if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');

function getGrade(s) {
    if (s >= 80) return { grade: 'A1', class: 'grade-a1' };
    if (s >= 70) return { grade: 'B2', class: 'grade-b2' };
    if (s >= 65) return { grade: 'B3', class: 'grade-b3' };
    if (s >= 60) return { grade: 'C4', class: 'grade-c4' };
    if (s >= 55) return { grade: 'C5', class: 'grade-c5' };
    if (s >= 50) return { grade: 'C6', class: 'grade-c6' };
    if (s >= 45) return { grade: 'D7', class: 'grade-d7' };
    if (s >= 40) return { grade: 'E8', class: 'grade-e8' };
    return { grade: 'F9', class: 'grade-f9' };
}

function showLogin() {
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('registrationSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'none';
}

function showRegistration() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('registrationSection').style.display = 'block';
    document.getElementById('dashboardSection').style.display = 'none';
}

// Register Student
async function registerStudent() {
    const schoolName = document.getElementById('regSchoolName').value.trim();
    const fullName = document.getElementById('regFullName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const pw = document.getElementById('regPassword').value;
    const cpw = document.getElementById('regConfirmPassword').value;
    const msg = document.getElementById('registrationMessage');
    
    msg.innerHTML = '';
    
    if (!schoolName || !fullName || !pw) {
        msg.innerHTML = '<div class="error-box">❌ Fill all required fields</div>';
        return;
    }
    if (pw !== cpw) {
        msg.innerHTML = '<div class="error-box">❌ Passwords mismatch</div>';
        return;
    }
    if (pw.length < 6) {
        msg.innerHTML = '<div class="error-box">❌ Password must be 6+ characters</div>';
        return;
    }
    
    // Find school
    const { data: school, error: schoolError } = await supabase
        .from('schools')
        .select('*')
        .eq('name', schoolName)
        .eq('is_active', true)
        .single();
    
    if (schoolError || !school) {
        msg.innerHTML = '<div class="error-box">❌ School not found or not activated</div>';
        return;
    }
    
    // Generate student ID
    const { data: lastStudent } = await supabase
        .from('students')
        .select('student_id')
        .eq('school_id', school.id)
        .order('id', { ascending: false })
        .limit(1);
    
    let nextNumber = 1;
    if (lastStudent && lastStudent.length > 0) {
        const lastId = lastStudent[0].student_id;
        const num = parseInt(lastId.replace(/[^0-9]/g, ''));
        if (!isNaN(num)) nextNumber = num + 1;
    }
    
    const studentId = 'STU' + String(nextNumber).padStart(3, '0');
    
    // Insert student
    const { error: insertError } = await supabase
        .from('students')
        .insert([{
            school_id: school.id,
            student_id: studentId,
            name: fullName,
            email: email,
            phone: phone,
            password: hashPassword(pw),
            approved: false
        }]);
    
    if (insertError) {
        msg.innerHTML = '<div class="error-box">❌ Registration failed. Try again.</div>';
        return;
    }
    
    msg.innerHTML = `
        <div class="registration-id-display">
            <h3 style="color:#2e7d32">✅ Registration Successful!</h3>
            <p>Your Student ID:</p>
            <div class="student-id">${studentId}</div>
            <p style="color:var(--text2);margin-top:10px">⚠️ Save this ID! You'll need it to login.</p>
            <button class="btn btn-success" onclick="proceedToLogin('${studentId}', '${schoolName}')" style="margin-top:10px">🔑 Login Now →</button>
        </div>`;
    
    document.getElementById('regFullName').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regPhone').value = '';
    document.getElementById('regPassword').value = '';
    document.getElementById('regConfirmPassword').value = '';
}

function proceedToLogin(id, school) {
    showLogin();
    document.getElementById('studentIdLogin').value = id;
    document.getElementById('studentSchool').value = school;
}

// Login Student
async function loginStudent() {
    const schoolName = document.getElementById('studentSchool').value.trim();
    const studentId = document.getElementById('studentIdLogin').value.trim();
    const pw = document.getElementById('studentPassword').value;
    const msg = document.getElementById('loginMessage');
    
    msg.innerHTML = '';
    
    if (!schoolName || !studentId || !pw) {
        msg.innerHTML = '<div class="error-box">❌ Fill all fields</div>';
        return;
    }
    
    // Find school
    const { data: school } = await supabase
        .from('schools')
        .select('*')
        .eq('name', schoolName)
        .eq('is_active', true)
        .single();
    
    if (!school) {
        msg.innerHTML = '<div class="error-box">❌ School not found</div>';
        return;
    }
    
    // Find student
    const { data: student, error } = await supabase
        .from('students')
        .select('*')
        .eq('school_id', school.id)
        .eq('student_id', studentId)
        .single();
    
    if (error || !student || student.password !== hashPassword(pw)) {
        msg.innerHTML = '<div class="error-box">❌ Invalid credentials</div>';
        return;
    }
    
    currentStudent = student;
    currentSchool = school;
    
    sessionStorage.setItem('student_session', JSON.stringify({
        id: student.id,
        schoolId: school.id,
        studentId: student.student_id,
        name: student.name
    }));
    
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('registrationSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    
    document.getElementById('schoolName').innerHTML = school.name;
    document.getElementById('studentIdDisplay').innerHTML = student.student_id;
    document.getElementById('studentDisplayName').innerHTML = student.name;
    
    await loadSchoolData();
    await updateDashboard();
}

// Load school data
async function loadSchoolData() {
    const { data: programmes } = await supabase
        .from('programmes')
        .select('*')
        .eq('school_id', currentSchool.id);
    schoolData.programmes = programmes || [];
    
    const { data: subjects } = await supabase
        .from('subjects')
        .select('*')
        .eq('school_id', currentSchool.id);
    schoolData.subjects = subjects || [];
    
    const { data: scores } = await supabase
        .from('scores')
        .select('*')
        .eq('student_id', currentStudent.id);
    schoolData.scores = scores || [];
    
    const { data: enrollments } = await supabase
        .from('enrollments')
        .select('*')
        .eq('student_id', currentStudent.id);
    schoolData.enrollments = enrollments || [];
}

// Update Dashboard
async function updateDashboard() {
    // Approval banner
    const banner = document.getElementById('approvalBanner');
    if (!currentStudent.approved) {
        banner.innerHTML = '<div class="approval-banner">⏳ Pending approval from teacher</div>';
    } else {
        banner.innerHTML = '<div class="approval-banner approved">✅ Approved - You can now enroll in subjects</div>';
    }
    
    // Stats
    document.getElementById('totalSubjectsEnrolled').innerText = schoolData.enrollments.length;
    
    let total = 0, count = 0;
    schoolData.scores.forEach(s => { total += s.final_score; count++; });
    document.getElementById('overallAverage').innerText = count > 0 ? (total / count).toFixed(1) + '%' : '0%';
    document.getElementById('totalAssessments').innerText = count;
    document.getElementById('currentGrade').innerText = count > 0 ? getGrade(total / count).grade : 'N/A';
    
    // Profile
    document.getElementById('profileStudentId').value = currentStudent.student_id;
    document.getElementById('profileFullName').value = currentStudent.name;
    document.getElementById('profileSchool').value = currentSchool.name;
    const prog = schoolData.programmes.find(p => p.id === currentStudent.programme_id);
    document.getElementById('profileProgramme').value = prog ? prog.name : 'Not enrolled';
    document.getElementById('profileStatus').value = currentStudent.approved ? '✅ Approved' : '⏳ Pending';
    document.getElementById('profileEmail').value = currentStudent.email || '';
    document.getElementById('profilePhone').value = currentStudent.phone || '';
    
    await renderProgrammes();
    await renderMySubjects();
    await renderMyGrades();
}

// Render Available Programmes
async function renderProgrammes() {
    const container = document.getElementById('availableProgrammes');
    
    if (schoolData.programmes.length === 0) {
        container.innerHTML = '<div class="warning-box">No programmes available</div>';
        return;
    }
    
    container.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem">' +
        schoolData.programmes.map(p => {
            const isEnrolled = currentStudent.programme_id === p.id;
            const lc = p.level === 'JHS' ? 'level-jhs' : 'level-shs';
            const subCount = schoolData.subjects.filter(s => s.programme_id === p.id).length;
            return `
                <div class="enrollment-card ${isEnrolled ? 'selected' : ''}">
                    <h3>📚 ${p.name}</h3>
                    <p><span class="level-badge ${lc}">${p.level}</span> | ${subCount} subjects</p>
                    <p>${isEnrolled ? '✅ Currently enrolled' : '📝 Available'}</p>
                    ${isEnrolled ? 
                        `<button class="btn-sm btn-success" onclick="selectSubjects(${p.id})">Select Subjects</button>
                         <button class="btn-sm" style="background:#e74c3c;color:white" onclick="leaveProgramme()">Leave</button>` :
                        `<button class="btn-sm btn-info" onclick="enrollProgramme(${p.id})">Enroll</button>`
                    }
                </div>`;
        }).join('') + '</div>';
}

// Enroll in Programme
async function enrollProgramme(progId) {
    if (!currentStudent.approved) {
        showToast('⏳ You must be approved first');
        return;
    }
    
    await supabase.from('students').update({ programme_id: progId }).eq('id', currentStudent.id);
    currentStudent.programme_id = progId;
    
    // Remove old enrollments
    await supabase.from('enrollments').delete().eq('student_id', currentStudent.id);
    
    showToast('✅ Enrolled! Now select your subjects');
    await loadSchoolData();
    await updateDashboard();
    selectSubjects(progId);
}

// Leave Programme
async function leaveProgramme() {
    if (!confirm('Leave this programme? Your enrollments will be removed.')) return;
    
    await supabase.from('students').update({ programme_id: null }).eq('id', currentStudent.id);
    await supabase.from('enrollments').delete().eq('student_id', currentStudent.id);
    
    currentStudent.programme_id = null;
    schoolData.enrollments = [];
    
    showToast('Left programme');
    await loadSchoolData();
    await updateDashboard();
}

// Select Subjects
async function selectSubjects(progId) {
    const container = document.getElementById('subjectSelection');
    const checkboxes = document.getElementById('subjectCheckboxes');
    
    const progSubjects = schoolData.subjects.filter(s => s.programme_id === progId);
    const enrolledSubjectIds = schoolData.enrollments.map(e => e.subject_id);
    
    container.style.display = 'block';
    checkboxes.innerHTML = progSubjects.map(s => `
        <div class="enrollment-card ${enrolledSubjectIds.includes(s.id) ? 'selected' : ''}">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
                <input type="checkbox" 
                       value="${s.id}" 
                       ${enrolledSubjectIds.includes(s.id) ? 'checked' : ''}
                       onchange="toggleSubject(${s.id}, this.checked)">
                <span>📖 ${s.name}</span>
            </label>
        </div>
    `).join('');
}

// Toggle Subject Enrollment
async function toggleSubject(subjectId, checked) {
    if (checked) {
        await supabase.from('enrollments').insert([{
            student_id: currentStudent.id,
            subject_id: subjectId
        }]);
    } else {
        await supabase.from('enrollments').delete()
            .eq('student_id', currentStudent.id)
            .eq('subject_id', subjectId);
    }
    
    await loadSchoolData();
    await updateDashboard();
    showToast(checked ? '✅ Subject added' : 'Subject removed');
}

// Render My Subjects
async function renderMySubjects() {
    const container = document.getElementById('mySubjectsList');
    
    if (schoolData.enrollments.length === 0) {
        container.innerHTML = '<div class="warning-box">You are not enrolled in any subjects</div>';
        return;
    }
    
    const enrolledSubjects = schoolData.enrollments.map(e => {
        const subject = schoolData.subjects.find(s => s.id === e.subject_id);
        const scores = schoolData.scores.filter(s => s.subject_id === e.subject_id);
        const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b.final_score, 0) / scores.length).toFixed(1) : '—';
        const best = scores.length > 0 ? Math.max(...scores.map(s => s.final_score)) : 0;
        const g = scores.length > 0 ? getGrade(best) : { grade: 'N/A', class: '' };
        
        return { subject, avg, best, g, count: scores.length };
    });
    
    container.innerHTML = `
        <table>
            <thead><tr><th>Subject</th><th style="text-align:center">Average</th><th style="text-align:center">Best</th><th style="text-align:center">Tests</th></tr></thead>
            <tbody>${enrolledSubjects.map(e => `
                <tr>
                    <td><strong>${e.subject ? e.subject.name : 'Unknown'}</strong></td>
                    <td style="text-align:center">${e.avg === '—' ? '—' : e.avg + '%'}</td>
                    <td style="text-align:center"><span class="${e.g.class}">${e.g.grade}</span></td>
                    <td style="text-align:center">${e.count}</td>
                </tr>
            `).join('')}</tbody>
        </table>`;
}

// Render My Grades
async function renderMyGrades() {
    const container = document.getElementById('myGrades');
    
    const sortedScores = [...schoolData.scores].sort((a, b) => new Date(b.date) - new Date(a.date));
    
    if (sortedScores.length === 0) {
        container.innerHTML = '<div class="warning-box">No assessments recorded yet</div>';
        return;
    }
    
    container.innerHTML = `
        <table>
            <thead><tr><th>Date</th><th>Subject</th><th>Term</th><th>Final</th><th>Grade</th></tr></thead>
            <tbody>${sortedScores.map(sc => {
                const subject = schoolData.subjects.find(s => s.id === sc.subject_id);
                const g = getGrade(sc.final_score);
                return `
                    <tr>
                        <td>${new Date(sc.date).toLocaleDateString()}</td>
                        <td><strong>${subject ? subject.name : '—'}</strong></td>
                        <td>T${sc.term}</td>
                        <td><strong>${sc.final_score.toFixed(1)}%</strong></td>
                        <td><span class="${g.class}">${g.grade}</span></td>
                    </tr>`;
            }).join('')}</tbody>
        </table>`;
}

// Update Profile
async function updateProfile() {
    const name = document.getElementById('profileFullName').value;
    const email = document.getElementById('profileEmail').value;
    const phone = document.getElementById('profilePhone').value;
    
    const { error } = await supabase
        .from('students')
        .update({ name, email, phone })
        .eq('id', currentStudent.id);
    
    if (error) {
        showToast('❌ Update failed');
        return;
    }
    
    currentStudent.name = name;
    currentStudent.email = email;
    currentStudent.phone = phone;
    document.getElementById('studentDisplayName').innerHTML = name;
    showToast('✅ Profile updated!');
}

// Change Password
async function changePassword() {
    const cp = document.getElementById('currentPwd').value;
    const np = document.getElementById('newPassword').value;
    const conp = document.getElementById('confirmPassword').value;
    
    if (!cp || !np) { showToast('Fill all fields'); return; }
    if (np !== conp) { showToast('Passwords mismatch'); return; }
    if (np.length < 6) { showToast('6+ characters required'); return; }
    
    if (currentStudent.password !== hashPassword(cp)) {
        showToast('Wrong current password');
        return;
    }
    
    await supabase.from('students').update({ password: hashPassword(np) }).eq('id', currentStudent.id);
    
    showToast('🔒 Password changed!');
    document.getElementById('currentPwd').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
}

// Tab switching
function showTab(tab) {
    ['enrollment', 'subjects', 'grades', 'profile'].forEach(t => {
        document.getElementById(t + 'Tab').style.display = 'none';
    });
    document.getElementById(tab + 'Tab').style.display = 'block';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
}

// Logout
function logout() {
    currentStudent = null;
    currentSchool = null;
    sessionStorage.removeItem('student_session');
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
    showToast('👋 Logged out');
}

// Check session
async function checkSession() {
    const session = sessionStorage.getItem('student_session');
    if (session) {
        const sess = JSON.parse(session);
        const { data: student } = await supabase
            .from('students')
            .select('*')
            .eq('id', sess.id)
            .single();
        
        if (student) {
            const { data: school } = await supabase
                .from('schools')
                .select('*')
                .eq('id', student.school_id)
                .single();
            
            if (school && school.is_active) {
                currentStudent = student;
                currentSchool = school;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('registrationSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('schoolName').innerHTML = school.name;
                document.getElementById('studentIdDisplay').innerHTML = student.student_id;
                document.getElementById('studentDisplayName').innerHTML = student.name;
                await loadSchoolData();
                await updateDashboard();
                return;
            }
        }
        sessionStorage.removeItem('student_session');
    }
}

checkSession();
</script>
