<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Milestone SMS</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #1a472a;
            --bg2: #0d2818;
            --card-bg: white;
            --text: #333;
            --text2: #666;
            --border: #ddd;
            --header-bg: #0d2818;
            --table-stripe: #f8f9fa;
            --hover: #f8f9fa;
            --input-bg: white;
            --input-border: #ddd;
            --shadow: rgba(0,0,0,0.1);
            --accent: #ffa502;
        }
        .dark-mode {
            --bg: #1a1a2e;
            --bg2: #0f0f1a;
            --card-bg: #2d2d44;
            --text: #e0e0e0;
            --text2: #aaa;
            --border: #444;
            --header-bg: #1a1a2e;
            --table-stripe: #3a3a55;
            --hover: #3a3a55;
            --input-bg: #3a3a55;
            --input-border: #555;
            --shadow: rgba(0,0,0,0.3);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));min-height:100vh;color:var(--text);transition:all .3s}
        .container{max-width:1400px;margin:0 auto;padding:20px}
        .login-container{max-width:500px;margin:50px auto;background:var(--card-bg);border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
        .card{background:var(--card-bg);border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 10px var(--shadow);color:var(--text)}
        .header{background:var(--header-bg);color:white;padding:1rem 2rem;border-radius:1rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
        .logo-img{max-height:35px;margin-right:8px;vertical-align:middle}
        h2{color:#1a472a;margin-bottom:15px;border-left:4px solid var(--accent);padding-left:12px}
        .dark-mode h2{color:var(--accent)}
        h3{color:var(--text);margin:15px 0 10px 0}
        .form-group{margin-bottom:1rem}
        .form-group label{display:block;font-weight:600;margin-bottom:.3rem;color:var(--text)}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:.8rem;border:1px solid var(--input-border);border-radius:.5rem;font-size:1rem;background:var(--input-bg);color:var(--text)}
        .form-group textarea{resize:vertical;font-family:inherit}
        .btn{background:linear-gradient(135deg,#2ecc71,#27ae60);color:white;border:none;padding:.8rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600}
        .btn:hover{transform:translateY(-2px)}
        .btn-success{background:linear-gradient(135deg,#2ecc71,#27ae60)}
        .btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b)}
        .btn-info{background:linear-gradient(135deg,var(--accent),#e67e22)}
        .btn-warning{background:linear-gradient(135deg,var(--accent),#e67e22)}
        .btn-sm{padding:.3rem .8rem;font-size:.8rem}
        .header-btn-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
        .stat-card{background:linear-gradient(135deg,#1a472a,#0d2818);color:white;padding:1rem;border-radius:1rem;text-align:center}
        .stat-number{font-size:1.8rem;font-weight:bold}
        .nav-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid var(--border);flex-wrap:wrap}
        .nav-tab{padding:.8rem 1.2rem;background:none;border:none;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:.9rem;transition:all .2s}
        .nav-tab i{margin-right:6px}
        .nav-tab:hover{color:var(--accent)}
        .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
        .dark-mode .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
        .dark-mode .nav-tab:hover{color:var(--accent)}
        .tab-content{display:none}
        .tab-content.active{display:block}
        .form-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
        .form-row .form-group{flex:1;min-width:150px}
        .error{color:#c62828;background:#ffebee;padding:10px;border-radius:8px;margin:10px 0}
        .info-box{background:#e8f5e9;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #2ecc71}
        .warning-box{background:#fff3e0;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #f39c12}
        .sending-box{background:#e3f2fd;padding:1rem;border-radius:.5rem;margin-top:.5rem;border-left:4px solid #2196f3;color:#1565c0}
        .success-sent{background:#e8f5e9;padding:1rem;border-radius:.5rem;margin-top:.5rem;border-left:4px solid #4caf50;color:#2e7d32}
        .weight-preview{background:#f0f8ff;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid var(--accent)}
        .grade-a1{background:#2e7d32;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-b2{background:#43a047;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-b3{background:#66bb6a;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-c4{background:#ef6c00;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-c5{background:#ff9800;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-c6{background:#ffb74d;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .grade-d7,.grade-e8,.grade-f9{background:#c62828;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:bold}
        .toast{position:fixed;bottom:20px;right:20px;background:#333;color:white;padding:.8rem 1.5rem;border-radius:2rem;z-index:1000;animation:slideIn .3s ease}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        table{width:100%;border-collapse:collapse}
        th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}
        th{background:var(--table-stripe);font-weight:600}
        tr:hover{background:var(--hover)}
        .export-btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
        .settings-config{background:var(--table-stripe);padding:1rem;border-radius:.5rem;margin-bottom:.5rem;border:1px solid var(--border)}
        .settings-config summary{font-weight:600;cursor:pointer;color:var(--text2);font-size:.9rem}
        .badge-count{display:inline-block;color:white;padding:3px 12px;border-radius:15px;font-weight:bold;font-size:.85rem}
        .badge-subjects{background:#3498db}
        .badge-students{background:#2ecc71}
        .template-card{background:#fef9e7;border:1px solid var(--accent);border-radius:.5rem;padding:1rem;margin-bottom:1rem}
        .brand-footer{text-align:center;padding:1rem;color:#888;font-size:.75rem;margin-top:1rem}
        .brand-footer span{color:var(--accent)}
        @media print{
            .sidebar,.nav-tabs,.btn,.toast,.header button,.header-btn-group,.search-container,.form-row,.no-print,.settings-config summary,.export-btns,#loginSection,#registrationSection,#forgotPasswordSection{display:none!important}
            body{background:white!important;font-size:12px}
            .container{max-width:100%;margin:0;padding:10px}
            .card{box-shadow:none!important;border:1px solid #ddd!important;margin-bottom:10px!important;padding:10px!important;break-inside:avoid}
            .header{background:#333!important;color:black!important;padding:10px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
            .header h2{color:black!important}
            table{font-size:10px}
            th,td{padding:4px 6px!important}
            h2{font-size:16px}h3{font-size:14px}
            .main-content{margin-left:0!important}
            @page{margin:1cm;size:A4}
        }
        @media(max-width:768px){.nav-tab{padding:.6rem .8rem;font-size:.8rem}.header-btn-group{gap:3px}}
    </style>
</head>
<body>

<div id="loginSection" class="login-container">
    <div style="text-align:center;margin-bottom:1rem">
        <img src="assets/logo.png" alt="Milestone SMS" style="max-height:60px" onerror="this.style.display='none'">
    </div>
    <h1 style="text-align:center;color:#1a472a">📊 Milestone SMS</h1>
    <p style="text-align:center;color:#666">Teacher Portal</p>
    <div id="loginMessage"></div>
    <div class="form-group"><label>🏫 School</label><input type="text" id="teacherSchool" placeholder="School name"></div>
    <div class="form-group"><label>📧 Email</label><input type="email" id="teacherEmail" placeholder="teacher@school.edu.gh"></div>
    <div class="form-group"><label>🔒 Password</label><input type="password" id="teacherPassword" placeholder="Password"></div>
    <button class="btn" onclick="loginTeacher()" style="width:100%">Login →</button>
    <div style="text-align:center;margin-top:1rem"><a href="#" onclick="showForgotPassword()" style="color:var(--accent);font-size:.9rem">Forgot Password?</a></div>
</div>

<div id="forgotPasswordSection" style="display:none">
    <div class="login-container"><h1 style="text-align:center;color:#1a472a">🔐 Reset Password</h1><div id="forgotMessage"></div>
        <div class="form-group"><label>🏫 School</label><input type="text" id="forgotSchool" placeholder="School name"></div>
        <div class="form-group"><label>📧 Email</label><input type="email" id="forgotEmail" placeholder="teacher@school.edu.gh"></div>
        <button class="btn btn-info" onclick="sendResetCode()">📧 Send Reset Code</button>
        <div id="resetCodeSection" style="display:none;margin-top:1rem">
            <div class="form-group"><label>🔢 Code</label><input type="text" id="resetCode" placeholder="6-digit" style="font-family:'Courier New',monospace;font-size:1.2rem;text-align:center;letter-spacing:3px"></div>
            <div class="form-group"><label>🔒 New Password</label><input type="password" id="newResetPassword" placeholder="Min 6 chars"></div>
            <button class="btn btn-success" onclick="verifyResetCode()">✅ Reset</button>
        </div>
        <div style="text-align:center;margin-top:1rem"><a href="#" onclick="showLogin()" style="color:var(--accent)">← Back</a></div>
    </div>
</div>

<div id="dashboardSection" style="display:none">
    <div class="header">
        <div>
            <h2 style="color:white;border:none">
                <img src="assets/logo.png" alt="Milestone SMS" class="logo-img" onerror="this.style.display='none'">
                <span id="schoolName"></span>
            </h2>
            <small id="licenseInfo" style="color:#aaa"></small>
        </div>
        <div class="header-btn-group">
            <span style="color:white"><i class="fas fa-user"></i> <span id="teacherName"></span></span>
            <button class="btn-sm btn-info" onclick="refreshAll()" title="Refresh - Reload latest data"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="btn-sm" onclick="window.print()" style="background:#95a5a6" title="Print - Print current page"><i class="fas fa-print"></i> Print</button>
            <button class="btn-sm" onclick="toggleDarkMode()" style="background:#555" title="Dark Mode - Toggle theme"><i class="fas fa-moon"></i> Dark</button>
            <button class="btn-sm btn-danger" onclick="logout()" title="Logout - Sign out"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="stats-grid"><div class="stat-card"><div class="stat-number" id="totalProgrammes">0</div><div>Programmes</div></div><div class="stat-card"><div class="stat-number" id="totalSubjects">0</div><div>Subjects</div></div><div class="stat-card"><div class="stat-number" id="totalStudents">0</div><div>Students</div></div><div class="stat-card"><div class="stat-number" id="totalAssessments">0</div><div>Assessments</div></div><div class="stat-card"><div class="stat-number" id="pendingCount">0</div><div>Pending</div></div></div>
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('programmes')" title="Programmes - Create and manage"><i class="fas fa-clipboard-list"></i> Programmes</button>
            <button class="nav-tab" onclick="showTab('subjects')" title="Subjects - Add GES subjects"><i class="fas fa-book"></i> Subjects</button>
            <button class="nav-tab" onclick="showTab('students')" title="Students - Enroll and manage"><i class="fas fa-user-graduate"></i> Students</button>
            <button class="nav-tab" onclick="showTab('marks')" title="Record Marks - CA and Exam"><i class="fas fa-pen-to-square"></i> Record Marks</button>
            <button class="nav-tab" onclick="showTab('grades')" title="Grade View - Charts"><i class="fas fa-trophy"></i> Grade View</button>
            <button class="nav-tab" onclick="showTab('cumulative')" title="Cumulative - Term progress"><i class="fas fa-chart-line"></i> Cumulative</button>
            <button class="nav-tab" onclick="showTab('email')" title="Send Email - Notifications"><i class="fas fa-envelope"></i> Send Email</button>
            <button class="nav-tab" onclick="showTab('export')" title="Export - GES format"><i class="fas fa-file-export"></i> Export</button>
            <button class="nav-tab" onclick="showTab('reportcard')" title="Report Card - Generate"><i class="fas fa-file-alt"></i> Report Card</button>
            <button class="nav-tab" onclick="showTab('settings')" title="Settings - Configure"><i class="fas fa-cog"></i> Settings</button>
        </div>

        <!-- ALL TAB CONTENTS REMAIN THE SAME AS YOUR ORIGINAL CODE -->
        <!-- (programmesTab, subjectsTab, studentsTab, marksTab, gradesTab, cumulativeTab, emailTab, exportTab, reportcardTab, settingsTab) -->

        <div class="brand-footer">© 2024 <span>Milestone SMS</span> • Powered by <span>Milestone Initiative</span></div>
    </div>
</div>
<div id="toast"></div>

<!-- KEEP ALL YOUR EXISTING JAVASCRIPT EXACTLY THE SAME -->
<script>
// ... (all your existing JavaScript code remains unchanged) ...
// Just update the email subject lines from "SchoolSync Pro" to "Milestone SMS"
</script>
</body>
</html>
