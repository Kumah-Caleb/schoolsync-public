<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Milestone SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        :root{--bg:#2d6b3f;--bg2:#d4a530;--card-bg:white;--text:#333;--text2:#666;--border:#ddd;--table-stripe:#f8f9fa}
        .dark-mode{--bg:#1a1a2e;--bg2:#0f0f1a;--card-bg:#2d2d44;--text:#e0e0e0;--text2:#aaa;--border:#444;--table-stripe:#3a3a55}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(225deg,#8db355,#e0c87a);min-height:100vh;color:var(--text)}
        .container{max-width:1200px;margin:0 auto;padding:2rem}
        .card{background:var(--card-bg);border-radius:1.5rem;padding:2rem;margin-bottom:2rem;box-shadow:0 20px 40px rgba(0,0,0,0.1)}
        .header{text-align:center;margin-bottom:2rem}
        .header h1{color:#1a472a;font-size:2rem;font-weight:800;letter-spacing:-0.5px}
        .dark-mode .header h1{color:#2ecc71}
        .form-group{margin-bottom:1.2rem}
        .form-group label{display:block;font-weight:600;margin-bottom:.4rem;color:var(--text)}
        .form-group input,.form-group select{width:100%;padding:.8rem;border:1px solid var(--border);border-radius:.5rem;font-size:1rem;background:var(--card-bg);color:var(--text);font-family:'Inter',sans-serif}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:#c8960a}
        .btn{background:linear-gradient(225deg,#8db355,#e0c87a);color:white;border:none;padding:.8rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600;width:100%;font-size:1rem;font-family:'Inter',sans-serif}
        .btn:hover{transform:translateY(-2px)}
        .btn-outline{background:transparent;border:2px solid #c8960a;color:#c8960a;width:auto}
        .btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b);width:auto;color:white}
        .btn-sm{padding:.4rem .8rem;font-size:.8rem;width:auto}
        .btn-success{background:linear-gradient(135deg,#2ecc71,#27ae60);width:auto;color:white}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
        .stat-card{background:linear-gradient(225deg,#8db355,#e0c87a);color:white;padding:1.5rem;border-radius:1rem;text-align:center}
        .stat-number{font-size:2rem;font-weight:800}
        .stat-label{margin-top:.3rem;font-size:.9rem;opacity:.9;font-weight:500}
        .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid var(--border);flex-wrap:wrap}
        .tab{padding:.8rem 1.2rem;background:none;border:none;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:'Inter',sans-serif}
        .tab.active{color:#c8960a;border-bottom-color:#c8960a}
        table{width:100%;border-collapse:collapse;font-size:.9rem}
        th,td{padding:.8rem;text-align:left;border-bottom:1px solid var(--border)}
        th{background:var(--table-stripe);font-weight:600}
        tr:hover{background:var(--table-stripe)}
        .status-badge{display:inline-block;padding:.2rem .6rem;border-radius:1rem;font-size:.75rem;font-weight:600}
        .status-active{background:#2ecc7120;color:#27ae60}
        .status-pending{background:#fff3cd;color:#856404}
        .grade-a1{background:#2e7d32;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .grade-b2{background:#43a047;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .grade-b3{background:#66bb6a;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .grade-c4{background:#ef6c00;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .grade-c5{background:#ff9800;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .grade-c6{background:#ffb74d;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .grade-d7,.grade-e8,.grade-f9{background:#c62828;color:white;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:700}
        .error-box{background:#ffebee;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #e74c3c;color:#c62828;font-weight:500}
        .success-box{background:#e8f5e9;padding:1rem;border-radius:.5rem;margin-bottom:1rem;border-left:4px solid #2ecc71;color:#2e7d32;font-weight:500}
        .toast{position:fixed;bottom:20px;right:20px;background:#333;color:white;padding:.8rem 1.5rem;border-radius:2rem;z-index:1000;animation:slideIn .3s ease;font-weight:500}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
        .level-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:700}
        .level-shs{background:#e8f0fe;color:#1a472a}.level-jhs{background:#fff3e0;color:#e67e22}
        @media(max-width:768px){.container{padding:1rem}.form-row{grid-template-columns:1fr}.header h1{font-size:1.5rem}}
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection">
        <div class="card" style="max-width:500px;margin:50px auto">
            <div class="header"><h1>👨‍🏫 Teacher Login</h1></div>
            <div id="loginError" class="error-box" style="display:none"></div>
            <div class="form-group"><label>🏫 School</label><input type="text" id="loginSchool" placeholder="School name"></div>
            <div class="form-group"><label>📧 Email</label><input type="email" id="loginEmail" placeholder="Teacher email"></div>
            <div class="form-group"><label>🔒 Password</label><input type="password" id="loginPassword" placeholder="Password"></div>
            <button class="btn" onclick="login()">🔑 Login →</button>
        </div>
    </div>

    <div id="dashboardSection" style="display:none">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
                <div><h2 style="color:#1a472a;font-weight:700"><span id="schoolName"></span></h2><small style="color:var(--text2)">👤 <span id="teacherName"></span></small></div>
                <div><button class="btn-outline btn-sm" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button><button class="btn-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="programmeCount">0</div><div class="stat-label">Programmes</div></div>
            <div class="stat-card"><div class="stat-number" id="subjectCount">0</div><div class="stat-label">Subjects</div></div>
            <div class="stat-card"><div class="stat-number" id="studentCount">0</div><div class="stat-label">Students</div></div>
            <div class="stat-card"><div class="stat-number" id="assessmentCount">0</div><div class="stat-label">Assessments</div></div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="showTab('programmes')">📚 Programmes</button>
                <button class="tab" onclick="showTab('subjects')">📖 Subjects</button>
                <button class="tab" onclick="showTab('students')">👨‍🎓 Students</button>
                <button class="tab" onclick="showTab('scores')">📊 Scores</button>
                <button class="tab" onclick="showTab('reports')">📋 Reports</button>
            </div>

            <div id="programmesTab">
                <h3 style="font-weight:700">Create Programme</h3>
                <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem">
                    <input type="text" id="progName" placeholder="Programme name" style="flex:2;min-width:200px;padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif">
                    <select id="progLevel" style="flex:1;min-width:120px;padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="JHS">JHS</option><option value="SHS">SHS</option></select>
                    <button class="btn" onclick="addProgramme()" style="width:auto">+ Add Programme</button>
                </div>
                <h3 style="font-weight:700">All Programmes</h3>
                <div id="programmesList"></div>
            </div>

            <div id="subjectsTab" style="display:none">
                <h3 style="font-weight:700">Add Subject to Programme</h3>
                <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem">
                    <select id="subjectProgramme" style="flex:1;min-width:200px;padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="">Select Programme</option></select>
                    <input type="text" id="subjectName" placeholder="Subject name" style="flex:2;min-width:200px;padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif">
                    <button class="btn" onclick="addSubject()" style="width:auto">+ Add Subject</button>
                </div>
                <h3 style="font-weight:700">All Subjects</h3>
                <div id="subjectsList"></div>
            </div>

            <div id="studentsTab" style="display:none">
                <h3 style="font-weight:700">Student Enrollments</h3>
                <div id="pendingStudents"></div>
                <h3 style="font-weight:700;margin-top:1.5rem">All Students</h3>
                <table><thead><tr><th>ID</th><th>Name</th><th>Programme</th><th>Status</th><th>Actions</th></tr></thead><tbody id="studentsTableBody"></tbody></table>
            </div>

            <div id="scoresTab" style="display:none">
                <h3 style="font-weight:700">Record Assessment</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem">
                    <select id="scoreSubject" style="padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="">Select Subject</option></select>
                    <select id="scoreStudent" style="padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="">Select Student</option></select>
                    <select id="scoreTerm" style="padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
                    <input type="number" id="classScore" placeholder="Class Score (%)" style="padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif" min="0" max="100">
                    <input type="number" id="examScore" placeholder="Exam Score (%)" style="padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif" min="0" max="100">
                    <button class="btn btn-success" onclick="recordScore()">💾 Save Score</button>
                </div>
                <h3 style="font-weight:700">Recent Assessments</h3>
                <div id="recentScores"></div>
            </div>

            <div id="reportsTab" style="display:none">
                <h3 style="font-weight:700">📋 Generate Report</h3>
                <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem">
                    <select id="reportStudent" style="flex:1;min-width:200px;padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="">Select Student</option></select>
                    <select id="reportTerm" style="flex:1;min-width:150px;padding:.7rem;border:1px solid var(--border);border-radius:.5rem;font-family:'Inter',sans-serif"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
                    <button class="btn" onclick="generateReport()" style="width:auto">📄 Generate Report</button>
                </div>
                <div id="reportResult"></div>
            </div>
        </div>
    </div>
</div>
<div id="toast"></div>

<script>
let currentTeacher=null,currentSchool=null,schoolData={programmes:[],subjects:[],students:[],scores:[]};
function hashPassword(pw){const s='SchoolSync_GH_2024';return btoa(btoa(pw+s).split('').reverse().join('')+s)}
function showToast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('toast');setTimeout(()=>t.classList.remove('toast'),3000)}
function toggleDarkMode(){document.body.classList.toggle('dark-mode');localStorage.setItem('darkMode',document.body.classList.contains('dark-mode'))}
if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');
function getGrade(s){if(s>=80)return{grade:'A1',class:'grade-a1'};if(s>=70)return{grade:'B2',class:'grade-b2'};if(s>=65)return{grade:'B3',class:'grade-b3'};if(s>=60)return{grade:'C4',class:'grade-c4'};if(s>=55)return{grade:'C5',class:'grade-c5'};if(s>=50)return{grade:'C6',class:'grade-c6'};if(s>=45)return{grade:'D7',class:'grade-d7'};if(s>=40)return{grade:'E8',class:'grade-e8'};return{grade:'F9',class:'grade-f9'}}

async function login(){
    const schoolName=document.getElementById('loginSchool').value.trim(),email=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPassword').value,err=document.getElementById('loginError');
    err.style.display='none';
    if(!schoolName||!email||!pw){err.innerHTML='❌ Fill all fields';err.style.display='block';return}
    const{data:school}=await supabase.from('schools').select('*').eq('name',schoolName).eq('is_active',true).single();
    if(!school){err.innerHTML='❌ School not found or not activated';err.style.display='block';return}
    const{data:teacher,error:teacherError}=await supabase.from('teachers').select('*').eq('school_id',school.id).eq('email',email).single();
    if(teacherError||!teacher||teacher.password!==hashPassword(pw)){err.innerHTML='❌ Invalid credentials';err.style.display='block';return}
    currentTeacher=teacher;currentSchool=school;
    sessionStorage.setItem('teacher_session',JSON.stringify({id:teacher.id,schoolId:school.id,name:teacher.name,email:teacher.email}));
    document.getElementById('loginSection').style.display='none';document.getElementById('dashboardSection').style.display='block';
    document.getElementById('schoolName').innerHTML=school.name;document.getElementById('teacherName').innerHTML=teacher.name;
    await loadAllData();
}

async function loadAllData(){
    const{data:programmes}=await supabase.from('programmes').select('*').eq('school_id',currentSchool.id).order('name');schoolData.programmes=programmes||[];
    const{data:subjects}=await supabase.from('subjects').select('*').eq('school_id',currentSchool.id).order('name');schoolData.subjects=subjects||[];
    const{data:students}=await supabase.from('students').select('*').eq('school_id',currentSchool.id).order('name');schoolData.students=students||[];
    const{data:scores}=await supabase.from('scores').select('*').eq('school_id',currentSchool.id).order('date',{ascending:false});schoolData.scores=scores||[];
    await updateStats();await renderProgrammes();await renderSubjects();await renderStudents();await renderRecentScores();await populateDropdowns();
}

async function updateStats(){document.getElementById('programmeCount').innerText=schoolData.programmes.length;document.getElementById('subjectCount').innerText=schoolData.subjects.length;document.getElementById('studentCount').innerText=schoolData.students.length;document.getElementById('assessmentCount').innerText=schoolData.scores.length}
async function addProgramme(){const name=document.getElementById('progName').value.trim(),level=document.getElementById('progLevel').value;if(!name){showToast('Enter programme name');return};await supabase.from('programmes').insert([{school_id:currentSchool.id,name,level}]);showToast('✅ Programme added!');document.getElementById('progName').value='';await loadAllData()}
async function renderProgrammes(){const container=document.getElementById('programmesList');if(schoolData.programmes.length===0){container.innerHTML='<p style="color:var(--text2)">No programmes created yet</p>';return}container.innerHTML=schoolData.programmes.map(p=>{const sc=schoolData.subjects.filter(s=>s.programme_id===p.id).length,lc=p.level==='JHS'?'level-jhs':'level-shs';return`<div style="border:1px solid var(--border);padding:1rem;border-radius:.5rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center"><div><strong>${p.name}</strong> <span class="level-badge ${lc}">${p.level}</span> <span style="color:var(--text2);margin-left:10px">${sc} subjects</span></div><button class="btn-danger btn-sm" onclick="deleteProgramme(${p.id})">🗑</button></div>`}).join('')}
async function deleteProgramme(id){if(!confirm('Delete this programme?'))return;await supabase.from('programmes').delete().eq('id',id);await supabase.from('subjects').delete().eq('programme_id',id);showToast('🗑 Programme deleted');await loadAllData()}
async function addSubject(){const progId=document.getElementById('subjectProgramme').value,name=document.getElementById('subjectName').value.trim();if(!progId||!name){showToast('Select programme and enter subject name');return};await supabase.from('subjects').insert([{school_id:currentSchool.id,programme_id:parseInt(progId),name}]);showToast('✅ Subject added!');document.getElementById('subjectName').value='';await loadAllData()}
async function renderSubjects(){const select=document.getElementById('subjectProgramme'),container=document.getElementById('subjectsList');select.innerHTML='<option value="">Select Programme</option>'+schoolData.programmes.map(p=>`<option value="${p.id}">${p.name} (${p.level})</option>`).join('');if(schoolData.subjects.length===0){container.innerHTML='<p style="color:var(--text2)">No subjects created yet</p>';return}container.innerHTML=schoolData.subjects.map(s=>{const prog=schoolData.programmes.find(p=>p.id===s.programme_id);return`<div style="border:1px solid var(--border);padding:.8rem;border-radius:.5rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center"><span>📖 <strong>${s.name}</strong> — ${prog?prog.name:'Unassigned'}</span><button class="btn-danger btn-sm" onclick="deleteSubject(${s.id})">🗑</button></div>`}).join('')}
async function deleteSubject(id){if(!confirm('Delete this subject?'))return;await supabase.from('subjects').delete().eq('id',id);await supabase.from('enrollments').delete().eq('subject_id',id);await supabase.from('scores').delete().eq('subject_id',id);showToast('🗑 Subject deleted');await loadAllData()}
async function renderStudents(){const pending=schoolData.students.filter(s=>!s.approved),pendingDiv=document.getElementById('pendingStudents');if(pending.length>0){pendingDiv.innerHTML='<h4 style="color:#856404;font-weight:600">⏳ Pending Approval</h4>'+pending.map(s=>`<div style="border:1px solid #ffc107;padding:.8rem;border-radius:.5rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center"><span>🆔 ${s.student_id} — ${s.name}</span><button class="btn-success btn-sm" onclick="approveStudent(${s.id})">✅ Approve</button></div>`).join('')}else{pendingDiv.innerHTML=''}const tbody=document.getElementById('studentsTableBody');if(schoolData.students.length===0){tbody.innerHTML='<tr><td colspan="5" style="text-align:center">No students registered</td></tr>';return}tbody.innerHTML=schoolData.students.map(s=>{const prog=schoolData.programmes.find(p=>p.id===s.programme_id);return`<tr><td>${s.student_id}</td><td><strong>${s.name}</strong></td><td>${prog?prog.name:'—'}</td><td><span class="status-badge ${s.approved?'status-active':'status-pending'}">${s.approved?'Active':'Pending'}</span></td><td>${!s.approved?`<button class="btn-success btn-sm" onclick="approveStudent(${s.id})">Approve</button>`:''}</td></tr>`}).join('')}
async function approveStudent(id){await supabase.from('students').update({approved:true}).eq('id',id);showToast('✅ Student approved!');await loadAllData()}
async function recordScore(){const subjectId=document.getElementById('scoreSubject').value,studentId=document.getElementById('scoreStudent').value,term=parseInt(document.getElementById('scoreTerm').value),classScore=parseFloat(document.getElementById('classScore').value)||0,examScore=parseFloat(document.getElementById('examScore').value)||0;if(!subjectId||!studentId){showToast('Select subject and student');return}const finalScore=(classScore*0.4)+(examScore*0.6);await supabase.from('scores').insert([{school_id:currentSchool.id,student_id:parseInt(studentId),subject_id:parseInt(subjectId),term,class_score:classScore,exam_score:examScore,final_score:finalScore}]);showToast('✅ Score recorded!');document.getElementById('classScore').value='';document.getElementById('examScore').value='';await loadAllData()}
async function renderRecentScores(){const container=document.getElementById('recentScores'),recent=schoolData.scores.slice(0,20);if(recent.length===0){container.innerHTML='<p style="color:var(--text2)">No assessments recorded</p>';return}container.innerHTML=`<table><thead><tr><th>Date</th><th>Student</th><th>Subject</th><th>Term</th><th>Final</th><th>Grade</th></tr></thead><tbody>${recent.map(sc=>{const student=schoolData.students.find(s=>s.id===sc.student_id),subject=schoolData.subjects.find(s=>s.id===sc.subject_id),g=getGrade(sc.final_score);return`<tr><td>${new Date(sc.date).toLocaleDateString()}</td><td>${student?student.name:'—'}</td><td>${subject?subject.name:'—'}</td><td>T${sc.term}</td><td><strong>${sc.final_score.toFixed(1)}%</strong></td><td><span class="${g.class}">${g.grade}</span></td></tr>`}).join('')}</tbody></table>`}
async function generateReport(){const studentId=document.getElementById('reportStudent').value,term=parseInt(document.getElementById('reportTerm').value),container=document.getElementById('reportResult');if(!studentId){showToast('Select student');return}const student=schoolData.students.find(s=>s.id===parseInt(studentId));if(!student)return;const studentScores=schoolData.scores.filter(s=>s.student_id===parseInt(studentId)&&s.term===term);let total=0,count=0;let html=`<div class="card"><h3 style="font-weight:700">📋 Report for ${student.name}</h3><p>🆔 ${student.student_id} | 📅 Term ${term}</p><table><thead><tr><th>Subject</th><th>Class (40%)</th><th>Exam (60%)</th><th>Final</th><th>Grade</th></tr></thead><tbody>`;studentScores.forEach(sc=>{const subject=schoolData.subjects.find(s=>s.id===sc.subject_id),g=getGrade(sc.final_score);total+=sc.final_score;count++;html+=`<tr><td>${subject?subject.name:'—'}</td><td>${sc.class_score}%</td><td>${sc.exam_score}%</td><td><strong>${sc.final_score.toFixed(1)}%</strong></td><td><span class="${g.class}">${g.grade}</span></td></tr>`});const avg=count>0?(total/count).toFixed(1):0,overall=getGrade(parseFloat(avg));html+=`</tbody></table><div style="text-align:center;margin-top:1rem;padding:1rem;background:#e8f5e9;border-radius:.5rem"><h3>Overall Average: ${avg}%</h3><span class="${overall.class}" style="font-size:1.5rem;padding:10px 30px">${overall.grade}</span></div><button class="btn" onclick="window.print()" style="width:auto;margin-top:1rem">🖨 Print Report</button></div>`;container.innerHTML=html}
async function populateDropdowns(){document.getElementById('scoreSubject').innerHTML='<option value="">Select Subject</option>'+schoolData.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');document.getElementById('scoreStudent').innerHTML='<option value="">Select Student</option>'+schoolData.students.filter(s=>s.approved).map(s=>`<option value="${s.id}">${s.name} (${s.student_id})</option>`).join('');document.getElementById('reportStudent').innerHTML='<option value="">Select Student</option>'+schoolData.students.filter(s=>s.approved).map(s=>`<option value="${s.id}">${s.name} (${s.student_id})</option>`).join('')}
function showTab(tab){['programmes','subjects','students','scores','reports'].forEach(t=>document.getElementById(t+'Tab').style.display='none');document.getElementById(tab+'Tab').style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active')}
function logout(){currentTeacher=null;currentSchool=null;sessionStorage.removeItem('teacher_session');document.getElementById('dashboardSection').style.display='none';document.getElementById('loginSection').style.display='block';showToast('👋 Logged out')}

async function checkSession(){const session=sessionStorage.getItem('teacher_session');if(session){const sess=JSON.parse(session);const{data:teacher}=await supabase.from('teachers').select('*').eq('id',sess.id).single();if(teacher){const{data:school}=await supabase.from('schools').select('*').eq('id',teacher.school_id).single();if(school&&school.is_active){currentTeacher=teacher;currentSchool=school;document.getElementById('loginSection').style.display='none';document.getElementById('dashboardSection').style.display='block';document.getElementById('schoolName').innerHTML=school.name;document.getElementById('teacherName').innerHTML=teacher.name;await loadAllData();return}}sessionStorage.removeItem('teacher_session')}}
checkSession();
</script>
