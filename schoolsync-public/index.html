<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:linear-gradient(225deg,#8db355,#e0c87a);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            position:relative;
            overflow:hidden;
        }
        body::before{
            content:'';
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:900px;
            height:900px;
            background:url('assets/logo.png') center/contain no-repeat;
            opacity:0.04;
            pointer-events:none;
            z-index:0;
        }
        .splash-container{
            text-align:center;
            position:relative;
            z-index:1;
            animation:fadeInUp 1.5s ease;
        }
        .splash-container img{
            width:500px;
            height:auto;
            display:block;
            margin:0 auto;
            transition:transform 0.5s ease;
            animation:pulse 3s infinite;
            filter:drop-shadow(0 10px 30px rgba(0,0,0,0.4)) brightness(1.15) contrast(1.1);
        }
        .splash-container:hover img{transform:scale(1.08)}
        .splash-hint{
            color:rgba(255,255,255,0.6);
            font-size:1rem;
            margin-top:2rem;
            animation:fadeIn 2s ease 1s both;
            font-weight:500;
            letter-spacing:0.5px;
        }
        .splash-hint i{animation:bounce 1.5s infinite}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
</head>
<body onclick="location.href='home.html'">
    <div class="splash-container">
        <img src="assets/logo.png" alt="Milestone" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=font-size:5rem;color:#c8960a;animation:pulse 3s infinite;font-weight:800;text-shadow:0 5px 20px rgba(0,0,0,0.5);letter-spacing:-2px>MILESTONE</div>'">
        <p class="splash-hint">Click anywhere to enter <i class="fas fa-arrow-right"></i></p>
    </div>
</body>
</html>
