<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:linear-gradient(225deg,#8db355,#e0c87a);
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            position:relative;
            overflow:hidden;
        }
        body::before{
            content:'';
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:min(900px,90vw);
            height:min(900px,90vw);
            background:url('assets/logo.png') center/contain no-repeat;
            opacity:0.04;
            pointer-events:none;
            z-index:0;
        }
        .splash-container{
            text-align:center;
            position:relative;
            z-index:1;
            animation:fadeInUp 1.5s ease;
            padding:1rem;
        }
        .splash-container img{
            width:min(500px,80vw);
            height:auto;
            display:block;
            margin:0 auto;
            transition:transform 0.5s ease;
            animation:pulse 3s infinite;
            filter:drop-shadow(0 10px 30px rgba(0,0,0,0.4)) brightness(1.15) contrast(1.1);
        }
        .splash-container:hover img{transform:scale(1.05)}
        .splash-container:active img{transform:scale(0.98)}
        .splash-hint{
            color:rgba(255,255,255,0.7);
            font-size:clamp(0.85rem,2vw,1.1rem);
            margin-top:clamp(1.5rem,3vw,2rem);
            animation:fadeIn 2s ease 1s both;
            font-weight:500;
            letter-spacing:0.5px;
        }
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        
        @media(max-width:480px){
            .splash-container img{width:min(350px,75vw)}
            .splash-hint{font-size:0.9rem}
        }
        @media(max-width:350px){
            .splash-container img{width:min(280px,70vw)}
            .splash-hint{font-size:0.8rem}
        }
    </style>
</head>
<body onclick="location.href='home.html'">
    <div class="splash-container">
        <img src="assets/logo.png" alt="Milestone" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=font-size:clamp(2.5rem,8vw,5rem);color:#c8960a;animation:pulse 3s infinite;font-weight:800;text-shadow:0 5px 20px rgba(0,0,0,0.5);letter-spacing:-2px>MILESTONE</div>'">
        <p class="splash-hint">Tap anywhere to enter</p>
    </div>
</body>
</html>
